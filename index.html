// Responsiv canvas

// Rensa skärmen
function clearScreen() {
    ctx.fillStyle = "#1f1e47";   // bakgrund
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e86500";   // textfärg
}

// Responsiv fontstorlek baserat på canvas
function setFont() {
    const fontSize = Math.floor(canvas.width / 12); // t.ex. 12 delar av bredden
    ctx.font = `${fontSize}px Impact`;
    ctx.textBaseline = "top";
}

// Word-wrap baserat på canvasbredd
function wrapText(text, maxWidth) {
    const words = text.split(" ");
    let lines = [];
    let currentLine = "";

    for (let word of words) {
        const testLine = currentLine ? currentLine + " " + word : word;
        if (ctx.measureText(testLine).width <= maxWidth) {
            currentLine = testLine;
        } else {
            if (currentLine) lines.push(currentLine);
            currentLine = word;
        }
    }

    if (currentLine) lines.push(currentLine);
    return lines;
}

        const lines = wrapText(content, maxWidth);

        // Vertikal centrering
        const lineHeight = parseInt(ctx.font, 10) * 1.2;
        let startY = (canvas.height - lines.length * lineHeight) / 2;

        lines.forEach((line, i) => {
            ctx.fillText(line, canvas.width * 0.125, startY + i * lineHeight);
        });

    } catch (e) {
        ctx.fillText("slut på grejor", canvas.width * 0.125, canvas.height / 2);
    }
});
