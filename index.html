function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Responsiv canvas
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.7; // 80% för canvas,
    clearScreen(); // rensa
}

window.addEventListener("resize", resizeCanvas);

// Rensa skärmen
function clearScreen() {
    ctx.fillStyle = "#1f1e47";   
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e86500";   
}

// Anpassad font som minskar om texten blir för lång
function setFont(linesLength = 1) {
    // Max fontstorlek baserat på canvasbredd
    let fontSize = Math.floor(canvas.width / 12);
    
    // Max höjd vi vill använda (90% av canvas)
    const maxHeight = canvas.height * 0.9;
    const lineHeight = fontSize * 1.2;

    // Om texten blir för lång, minska fonten så allt får plats
    if (linesLength * lineHeight > maxHeight) {
        fontSize = Math.floor(maxHeight / (linesLength * 1.2));
    }

    ctx.font = `${fontSize}px Impact`;
    ctx.textBaseline = "top";

    return fontSize;
}

// Word-wrap
function wrapText(text, maxWidth) {
    const words = text.split(" ");
    let lines = [];
    let currentLine = "";

    for (let word of words) {
        const testLine = currentLine ? currentLine + " " + word : word;

        // Om raden blir för lång, flytta hela ordet till nästa rad
        if (ctx.measureText(testLine).width > maxWidth) {
            if (currentLine) lines.push(currentLine); // spara raden
            currentLine = word; // börja ny rad med ordet
        } else {
            currentLine = testLine; // annars lägg till ordet på raden
        }
    }

    if (currentLine) lines.push(currentLine); // lägg till sista raden
    return lines;
}

    if (currentIndex < 0 || currentIndex >= lista.length) {

}

    const maxWidth = canvas.width * 0.8;
    const lines = wrapText(content, maxWidth);
    const fontSize = setFont(lines.length);
    const lineHeight = fontSize * 1.2;
    let startY = (canvas.height - lines.length * lineHeight) / 2;
    if (startY < 0) startY = 0;

    lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width * 0.05, startY + i * lineHeight);
    });
}
